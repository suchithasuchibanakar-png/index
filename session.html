<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: "Courier New", monospace;
    }

    .clock {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .time {
      font-size: clamp(2.5rem, 10vw, 5rem);
      color: #38bdf8;
      letter-spacing: 4px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    .period {
      margin-top: 10px;
      font-size: 1.5rem;
      color: #f472b6;
      letter-spacing: 6px;
    }

    .date {
      margin-top: 12px;
      font-size: 1rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="clock">
    <div class="time" id="time">--:--:--</div>
    <div class="period" id="period">--</div>
    <div class="date" id="date"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
 
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, "0");
      const seconds = String(now.getSeconds()).padStart(2, "0");

      // Determine AM/PM and convert to 12-hour format
      const period = hours >= 12 ? "PM" : "AM";
      hours = hours % 12 || 12; // 0 becomes 12 (midnight), 13 becomes 1, etc.
      const displayHours = String(hours).padStart(2, "0");

      document.getElementById("time").textContent =
        `${displayHours}:${minutes}:${seconds}`;
      document.getElementById("period").textContent = period;

      document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    updateClock();                 // Show the time immediately on load
    setInterval(updateClock, 1000); // Refresh every second
  </script>
</body>
</html>
